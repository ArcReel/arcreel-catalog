# 定时构建目录数据并发布到 main。
#
# 从第三方数据源抓取文本模型，叠加 data/ 下人工维护的数据，过 ArcReel main 上的目录数据校验器
# （arcreel-catalog-core）。校验失败时这次不发布；内容有变化时以 arcreel-catalog-bot 的身份直接提交
# catalog.json 与 manifest.json 到 main，不经 PR（该 App 是 main ruleset 的 bypass actor）。
#
# 按 ArcReel 发布版本放出：构建读取 ArcReel/ArcReel 的 latest release，最低应用版本高于它的供应商模型这次
# 不发布，日志列出暂缓（withheld:）与相对 main 新增（newly listed:）的清单项。被暂缓的是供应商默认模型
# （推荐模型）时沿用上一次发布的值，沿用不了就不发布这一项，日志列出结果（withheld default:）。读不到最新
# 发布版本时构建失败，main 上的发布数据不变；dry_run 同样按这条判定。
#
# 触发：每天一次；人工数据或构建脚本合入 main 后立即一次；ArcReel 正式版的 GitHub release 发布时由 ArcReel
# 仓库的 catalog-release-build.yml 触发一次（预发布版本不触发），放出随这个版本可用的模型；也可手动触发。
# 手动触发时勾选 dry_run 只构建与校验，不提交。bot 的提交只改两个发布文件，不在 paths 内，不会再次触发。
#
# release 触发的这次构建与 ArcReel 的镜像构建并行，不等镜像推送完成，数据通常先于镜像就绪：发版后重启的
# 实例启动时同步就能拿到本版放出的模型，镜像就绪前的旧实例只看到「需要新版本」的标注。实例要等这次构建
# 提交发布数据后才同步得到这些模型；先于它启动的实例，到下一次每日同步时取得。ArcReel 的镜像发布不依赖
# 这次构建；构建失败时 main 上的发布数据不变，由下一次定时构建或手动重跑放出。
name: Build catalog

on:
  schedule:
    - cron: "23 1 * * *"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "catalog_build/**"
      - "pyproject.toml"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建与校验，不提交发布数据"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-catalog
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    # fork 没有 bot 凭证，不跑
    if: github.repository == 'ArcReel/arcreel-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 取运行时 main 的最新提交：排队的运行看得到上一次的 bot 提交
          ref: main
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          # 不缓存：每次重新解析 arcreel-catalog-core，校验器始终是 ArcReel main 上的那一份
          enable-cache: false

      - name: Test build scripts
        run: uv run python -m pytest -q

      - name: Build and validate
        id: build
        env:
          # 读取 ArcReel 最新发布版本时认证，避开匿名请求的频率限制
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            uv run python -m catalog_build build --check-only
          else
            uv run python -m catalog_build build
          fi
          if git status --porcelain -- catalog.json manifest.json | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create App token
        id: app-token
        if: steps.build.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CATALOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
          owner: ArcReel
          repositories: arcreel-catalog
          permission-contents: write

      - name: Commit and push
        if: steps.build.outputs.changed == 'true'
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot_name="${APP_SLUG}[bot]"
          bot_id="$(GH_TOKEN="$PUSH_TOKEN" gh api "/users/${bot_name}" --jq .id)"
          git config user.name "$bot_name"
          git config user.email "${bot_id}+${bot_name}@users.noreply.github.com"
          version="$(jq -r .dataset_version manifest.json)"
          git add catalog.json manifest.json
          git commit -m "chore(data): 发布数据集 ${version}"
          git push "https://x-access-token:${PUSH_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" HEAD:main
